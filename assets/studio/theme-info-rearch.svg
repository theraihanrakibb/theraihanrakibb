    <text x="26" y="132" font-size="20">CUDA and Triton inference kernels</text>
    <text x="26" y="159" font-size="20">FP8 and FP4 KV-cache compression</text>
    <text class="card-footer" x="26" y="257" font-family="Cascadia Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14">GPU KERNELS / INFERENCE</text>
  </g>
  <path d="M26 226h538" stroke="var(--accent)" stroke-opacity=".55"/>
