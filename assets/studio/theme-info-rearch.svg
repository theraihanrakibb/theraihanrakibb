<svg xmlns="http://www.w3.org/2000/svg" width="590" height="285" viewBox="0 0 590 285" role="img" aria-labelledby="title description">
  <title id="title">SJTU ReArch Lab</title><style>
  :root { --surface:#eef3ff; --accent:#315693; --ink:#10213b; --edge:#31569342; }
  @media (prefers-color-scheme: dark) { :root { --surface:#172945; --accent:#a4befb; --ink:#f6f8fc; --edge:#a4befb55; } }
  .card-surface { fill:var(--surface); stroke:var(--edge); }
  .card-kicker, .card-footer { fill:var(--accent); }
</style>
  <desc id="description">SJTU ReArch Lab, Research Intern. I develop CUDA and Triton inference kernels and work on FP8 and FP4 KV-cache compression.</desc>
