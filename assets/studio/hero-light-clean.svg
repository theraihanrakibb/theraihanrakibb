<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Raihan</title>
  <desc id="desc">Raihan. ML System · LLM Inference · KV-Cache · Mooncake · SGLang · Agent RL. Actions speak louder than words.</desc>
  <style>
    .orbit { transform-origin: 931px 168px; animation: turn 18s linear infinite; }
    .topics-animated { display: none; }
    @media (prefers-reduced-motion: no-preference) {
      .topics-static { display: none; }
      .topics-animated { display: inline; }
      .topic { opacity: 0; animation: topic 16.8s linear infinite; }
    }
    @keyframes topic {
      0%, 14% { opacity: 1; }
      16.66%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
  </style>
  <defs>
    <radialGradient id="paper" cx="78%" cy="50%" r="72%">
      <stop stop-color="#e5e9f6"/><stop offset=".8" stop-color="#f6f3e9"/>
    </radialGradient>
    <linearGradient id="rule"><stop stop-color="#365b16"/><stop offset=".55" stop-color="#6844ad"/><stop offset="1" stop-color="#b5422d"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="url(#paper)" stroke="#d9d7c9" stroke-width="2"/>

  <text x="44" y="137" fill="#202739" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="500">Raihan</text>
  <text x="46" y="257" fill="#365b16" font-family="Georgia, serif" font-size="37" font-style="italic">Actions speak louder than words.</text>

  <path d="M46 218h500" stroke="url(#rule)" stroke-opacity=".45"/>
  <text class="topics-static" x="46" y="185" fill="#48546d" font-family="Arial, sans-serif" font-size="18" font-weight="bold">ML System · LLM Inference · KV-Cache · Mooncake · SGLang · Agent RL</text>
  <g class="topics-animated" fill="#365b16" font-family="Arial, sans-serif" font-size="26" font-weight="bold">
