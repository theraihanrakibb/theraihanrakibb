<svg xmlns="http://www.w3.org/2000/svg" width="590" height="285" viewBox="0 0 590 285" role="img" aria-labelledby="title description">
  <title id="title">3.2× speedup</title>
  <desc id="description">NVFP4-DiT: FP4-packed Triton kernels achieved 3.2 times the speed and used one-quarter of the memory compared with FP16. The paper is under review at IEEE TNNLS.</desc>
  <rect width="590" height="285" fill="#aee9df"/>
  <g fill="#1e2b25" font-family="Cascadia Mono, SFMono-Regular, Consolas, Liberation Mono, monospace">
    <text x="26" y="37" font-family="Cascadia Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15">FP4 VS. FP16</text>
    <text x="26" y="94" font-size="34" font-weight="bold">3.2× speedup</text>
    <text x="26" y="132" font-size="20">FP4-packed Triton kernels in NVFP4-DiT</text>
    <text x="26" y="159" font-size="20">One-quarter of the memory</text>
    <text x="26" y="257" font-family="Cascadia Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14">IEEE TNNLS / UNDER REVIEW</text>
  </g>
  <path d="M26 226h538" stroke="#1e2b25" stroke-opacity=".55"/>
